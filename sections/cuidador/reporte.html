<!-- ============ PANTALLA 9 · REPORTE DESCARGABLE ============ -->
<section class="screen" id="screen-reporte">
  <button
    class="btn-ghost btn-back btn-back-hero"
    id="btnBackFromReporte"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <div class="hero-panel-sm">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2; padding-left: 44px">
      <h2
        class="font-display"
        style="font-size: 20px; font-weight: 700; margin: 0 0 2px; color: #ffffff"
      >
        Reporte de seguimiento
      </h2>
      <p
        style="font-size: 13px; color: rgba(255, 255, 255, 0.82); margin: 0"
      >
        Para llevar a tu próxima cita o a un nuevo centro de salud.
      </p>
    </div>
  </div>

  <div class="card" id="reporteContenido" style="margin-bottom: 16px">
    <!-- Se llena por JS con renderReporte() -->
  </div>

  <button class="btn-primary" id="btnDescargarReporte">
    Descargar / imprimir
  </button>
  <p
    style="
      font-size: 11px;
      color: var(--ink-soft);
      text-align: center;
      margin-top: 10px;
    "
  >
    Prototipo: usa la opción de imprimir del navegador para simular la
    descarga en PDF.
  </p>
</section>
