<!-- ============ PANTALLA 3 · DASHBOARD CUIDADOR ============ -->
<section class="screen" id="screen-dashboard">
  <div class="hero-panel-sm">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div
      style="
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
      "
    >
      <div>
        <p style="font-size: 13px; color: rgba(255, 255, 255, 0.82); margin: 0">
          Hola,
        </p>
        <p
          class="font-display"
          style="font-size: 19px; font-weight: 700; margin: 0; color: #ffffff"
          id="txtCuidadorNombre"
        >
          Rosa
        </p>
      </div>
      <div
        style="
          width: 40px;
          height: 40px;
          border-radius: 50%;
          background: #ffffff;
          box-shadow: var(--shadow-sm);
          overflow: hidden;
        "
      >
        <img src="images/cuidador.jpeg" alt="Cuidador" class="avatar-img" />
      </div>
    </div>
  </div>

  <!-- Tarjeta: Ruta hematológica -->
  <div class="card" style="margin-bottom: 14px">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      "
    >
      <div>
        <p
          style="
            font-size: 11px;
            font-weight: 700;
            color: var(--ink-soft);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
          "
        >
          Ruta de <span id="txtPacienteNombre">Mateo</span>
        </p>
        <p
          class="font-display"
          style="font-size: 18px; font-weight: 700; margin: 2px 0 0"
        >
          Fase: Mantenimiento
        </p>
      </div>
      <div style="text-align: right; flex-shrink: 0">
        <span class="pill pill-medio" id="pillRiesgo">Riesgo medio</span>
        <button
          id="linkProfesionalesDashboard"
          style="
            display: block;
            margin-top: 4px;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--primario);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            text-align: right;
          "
        >
          3 profesionales asignados · Ver detalle
        </button>
      </div>
    </div>

    <div class="ruta-track" id="rutaTrack"></div>
  </div>

  <!-- Tarjeta: próxima cita -->
  <div
    class="card"
    style="
      margin-bottom: 14px;
      border-color: var(--salud);
      background: var(--salud-tint);
    "
  >
    <p
      style="
        font-size: 11px;
        font-weight: 700;
        color: var(--salud-dark);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 4px;
      "
    >
      Próxima cita
    </p>
    <p style="font-weight: 700; margin: 0 0 2px">
      Control hematológico
    </p>
    <p style="font-size: 13px; color: var(--ink-soft); margin: 0">
      Viernes 14 de agosto · 9:00 a. m.
    </p>
    <p
      style="
        font-size: 12px;
        color: var(--ink-soft);
        margin: 2px 0 12px;
      "
    >
      Instituto Nacional de Salud del Niño – San Borja
    </p>
    <button
      class="btn-primary"
      id="btnVerDetalleCita"
      style="background: var(--salud-dark)"
    >
      Ver detalles
    </button>
  </div>

  <!-- Aviso / recordatorio -->
  <div
    class="card"
    style="
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--wawa-tint);
      border-color: var(--wawa);
    "
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--wawa-dark)"
      stroke-width="2"
      style="flex-shrink: 0; margin-top: 2px"
    >
      <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    <p style="font-size: 13px; margin: 0; color: var(--ink)">
      Recuerda traer el informe de tu último análisis a la cita del
      viernes.
    </p>
  </div>

  <!-- Acciones rápidas -->
  <p
    style="
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 4px 0 8px;
    "
  >
    Acciones rápidas
  </p>
  <div
    style="
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    "
    id="accionesGrid"
  >
    <button
      class="card action-card card--tint-primario"
      data-action="documentos"
      style="text-align: left; cursor: pointer"
    >
      <div class="role-icon" style="width: 40px; height: 40px; border-radius: 12px">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <path d="M14 2v6h6" />
        </svg>
      </div>
      <p style="font-size: 12.5px; font-weight: 700; margin: 10px 0 0">
        Subir documento
      </p>
    </button>
    <button
      class="card action-card card--tint-primario"
      data-action="consentimiento"
      style="text-align: left; cursor: pointer"
    >
      <div class="role-icon" style="width: 40px; height: 40px; border-radius: 12px">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M12 22s8-4.5 8-11.8V5l-8-3-8 3v5.2C4 17.5 12 22 12 22z"
          />
        </svg>
      </div>
      <p style="font-size: 12.5px; font-weight: 700; margin: 10px 0 0">
        Compartir con médico
      </p>
    </button>
    <button
      class="card action-card card--tint-primario"
      data-action="reporte"
      style="text-align: left; cursor: pointer"
    >
      <div class="role-icon" style="width: 40px; height: 40px; border-radius: 12px">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
      </div>
      <p style="font-size: 12.5px; font-weight: 700; margin: 10px 0 0">
        Generar reporte
      </p>
    </button>
    <button
      class="card action-card card--tint-wawa"
      data-action="avatar"
      style="text-align: left; cursor: pointer"
    >
      <div
        class="role-icon"
        style="
          width: 40px;
          height: 40px;
          border-radius: 12px;
          background: var(--wawa-tint);
          color: var(--wawa-dark);
        "
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M12 21s-7.5-4.6-10-9.3C.5 8.1 2.3 4.5 6 4c2-.3 3.6.7 6 3 2.4-2.3 4-3.3 6-3 3.7.5 5.5 4.1 4 7.7C19.5 16.4 12 21 12 21z"
          />
        </svg>
      </div>
      <p style="font-size: 12.5px; font-weight: 700; margin: 10px 0 0">
        Avatar de Mateo
      </p>
    </button>
  </div>

  <button
    class="card action-card card--tint-salud"
    data-action="mapa"
    style="
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      margin-bottom: 18px;
    "
  >
    <div
      class="role-icon"
      style="
        background: var(--salud-tint);
        color: var(--salud);
        flex-shrink: 0;
      "
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M9 20l-5-2V6l5 2m0 12l6-2m-6 2V8m6 10l5 2V8l-5-2m0 12V6m0 0L9 8"
        />
      </svg>
    </div>
    <div>
      <p style="font-weight: 700; font-size: 13.5px; margin: 0">
        Hospitales cercanos
      </p>
      <p
        style="
          font-size: 11.5px;
          color: var(--ink-soft);
          margin: 1px 0 0;
        "
      >
        Encuentra el centro de salud más próximo
      </p>
    </div>
  </button>
</section>
