<!-- ============ PANTALLA 13 · PERFIL (tab "Perfil") ============ -->
<section class="screen" id="screen-perfil">
  <div class="hero-panel-sm">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2; text-align: center">
      <div
        style="
          width: 68px;
          height: 68px;
          margin: 0 auto 10px;
          border-radius: 50%;
          background: #ffffff;
          box-shadow: var(--shadow-sm);
          overflow: hidden;
        "
      >
        <img src="images/cuidador.jpeg" alt="Cuidador" class="avatar-img" />
      </div>
      <p
        class="font-display"
        style="font-size: 18px; font-weight: 700; margin: 0; color: #ffffff"
        id="txtPerfilNombre"
      >
        Rosa Quispe
      </p>
      <p
        style="
          font-size: 12.5px;
          color: rgba(255, 255, 255, 0.82);
          margin: 2px 0 0;
        "
        id="txtPerfilParentesco"
      >
        Mamá
      </p>
    </div>
  </div>

  <p
    style="
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 18px 0 8px 2px;
    "
  >
    Mis datos
  </p>
  <div class="card" style="margin-bottom: 16px">
    <div class="kv-row">
      <span class="kv-label">DNI</span>
      <span class="kv-value" id="txtPerfilDni">45678912</span>
    </div>
    <div class="kv-row">
      <span class="kv-label">Celular</span>
      <span class="kv-value" id="txtPerfilTelefono">987 654 321</span>
    </div>
    <div class="kv-row">
      <span class="kv-label">Correo</span>
      <span class="kv-value" id="txtPerfilEmail">rosa.quispe@ejemplo.com</span>
    </div>
    <div class="kv-row">
      <span class="kv-label">Vivienda</span>
      <span class="kv-value" id="txtPerfilDireccion"
        >Jr. Los Andes 245, Andahuaylas</span
      >
    </div>
  </div>

  <p
    style="
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 8px 2px;
    "
  >
    Datos de <span id="txtPerfilPacienteNombre">Mateo</span>
  </p>
  <div class="card" style="margin-bottom: 16px">
    <div class="kv-row">
      <span class="kv-label">Edad</span>
      <span class="kv-value" id="txtPerfilEdad">6 años</span>
    </div>
    <div class="kv-row">
      <span class="kv-label">Tipo de sangre</span>
      <span class="kv-value" id="txtPerfilSangre">O+</span>
    </div>
  </div>

  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 8px 2px;
    "
  >
    <p
      style="
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0;
      "
    >
      Documentos subidos
    </p>
    <button
      id="btnIrDocumentosDesdePerfil"
      style="
        font-size: 11.5px;
        font-weight: 700;
        color: var(--salud);
        background: none;
        border: none;
        cursor: pointer;
      "
    >
      + Subir
    </button>
  </div>
  <div id="listaDocumentosPerfil" style="margin-bottom: 16px"></div>

  <button
    class="btn-ghost"
    id="btnIrConsentimientoDesdePerfil"
    style="margin-bottom: 10px"
  >
    Gestionar acceso de médicos
  </button>
  <button
    class="btn-ghost"
    id="btnCerrarSesion"
    style="
      color: var(--riesgo-alto);
      border-color: var(--riesgo-alto);
    "
  >
    Cerrar sesión
  </button>
</section>
