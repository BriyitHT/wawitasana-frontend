<!-- ============ PANTALLA 8 · AVATAR DEL NIÑO ============ -->
<section class="screen" id="screen-nino">
  <div class="hero-panel-sm hero-panel-sm--wawa">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2">
      <div style="display: flex; justify-content: flex-end">
        <button
          id="btnSalirNino"
          style="
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
          "
        >
          Salir
        </button>
      </div>
      <p
        class="font-display"
        style="
          font-size: 20px;
          font-weight: 700;
          margin: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          color: #ffffff;
        "
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
        >
          <path d="M12 2l1.8 5.3L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.7L12 2z" />
        </svg>
        <span>¡Hola, <span id="txtNinoNombre">Mateo</span>!</span>
      </p>
    </div>
  </div>

  <div style="text-align: center; padding: 0 0 6px">
    <div
      id="avatarCirculo"
      style="
        width: 150px;
        height: 150px;
        margin: 0 auto 10px;
        border-radius: 50%;
        background: var(--wawa);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 26px rgba(239, 135, 166, 0.35);
        position: relative;
      "
    >
      <span
        id="avatarInsignia"
        style="
          position: absolute;
          top: -6px;
          right: 0;
          width: 28px;
          height: 28px;
          border-radius: 50%;
          background: var(--surface);
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
          display: none;
          align-items: center;
          justify-content: center;
          color: var(--wawa-dark);
        "
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z" />
          <path d="M5 21h14" />
        </svg>
      </span>
      <svg width="86" height="86" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 3c-3 0-5 2-6 5-2 .3-3.5 2-3.5 4.2 0 2 1.3 3.6 3.1 4C6.3 18.6 9 20 12 20s5.7-1.4 6.4-3.8c1.8-.4 3.1-2 3.1-4C21.5 10 20 8.3 18 8c-1-3-3-5-6-5z"
          fill="white"
        />
        <circle cx="9" cy="12" r="1.3" fill="var(--wawa-dark)" />
        <circle cx="15" cy="12" r="1.3" fill="var(--wawa-dark)" />
        <path
          d="M9.5 15.5c1.6 1 3.4 1 5 0"
          stroke="var(--wawa-dark)"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <p
      class="font-display"
      style="font-weight: 700; font-size: 17px; margin: 0"
    >
      Kuntur
    </p>
    <p
      style="
        font-size: 12.5px;
        color: var(--ink-soft);
        margin: 2px 0 0;
      "
      id="txtNinoEtapa"
    >
      Tu compañero de ruta · Nivel <span id="txtNinoNivel">3</span>
    </p>
  </div>

  <div
    class="card card--tint-wawa"
    style="margin: 18px 0 14px; background: var(--wawa-tint)"
  >
    <p
      style="
        font-size: 11px;
        font-weight: 700;
        color: var(--ink-soft);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 0 0 6px;
      "
    >
      Reto de hoy
    </p>
    <p
      style="
        font-weight: 700;
        margin: 0 0 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      "
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="var(--wawa-dark)"
        stroke-width="2"
        style="flex-shrink: 0"
      >
        <path d="M10.5 20.5L3.5 13.5a5 5 0 0 1 7.07-7.07l7 7a5 5 0 0 1-7.07 7.07z" />
        <path d="M8.5 8.5l7 7" />
      </svg>
      Toma tu medicina a las 8:00 p. m.
    </p>
    <p
      style="
        font-size: 12.5px;
        color: var(--ink-soft);
        margin: 0 0 14px;
      "
    >
      Si lo logras, Kuntur gana un nuevo poder:
      <strong>vuelo veloz</strong>
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="var(--wawa-dark)"
        style="vertical-align: -1px"
      >
        <path d="M12 2l1.8 5.3L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.7L12 2z" />
      </svg>
    </p>
    <button
      class="btn-primary"
      id="btnCumplirReto"
      style="
        background: var(--wawa);
        box-shadow: 0 8px 18px rgba(239, 135, 166, 0.32);
      "
    >
      <span class="btn-icon-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.1V12a10 10 0 1 1-5.9-9.1" />
          <path d="M22 4L12 14.01l-3-3" />
        </svg>
        ¡Ya lo hice!
      </span>
    </button>
  </div>

  <div
    class="card"
    style="display: flex; gap: 10px; align-items: flex-start"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="var(--salud)"
      stroke-width="2"
      style="flex-shrink: 0"
    >
      <rect x="3" y="4" width="18" height="18" rx="2" />
      <path d="M16 2v4M8 2v4M3 10h18" />
    </svg>
    <p style="font-size: 13px; margin: 0; color: var(--ink)">
      El <strong>viernes</strong> tienes tu control. ¡Vamos juntos!
    </p>
  </div>
</section>
