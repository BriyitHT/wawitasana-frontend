<!-- ============ PANTALLA 15 · CÓDIGO DE ACCESO DEL NIÑO ============ -->
<section class="screen" id="screen-login-nino">
  <button
    class="btn-ghost btn-back"
    id="btnBackToSplashNino"
    style="
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    "
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <div class="hero-panel">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2">
      <div
        class="auth-icon"
        style="background: var(--surface); color: var(--wawa)"
      >
        <img src="images/nino.jpeg" alt="Niño" />
      </div>
      <p
        class="font-display"
        style="font-size: 19px; font-weight: 700; margin: 0 0 6px; color: #ffffff"
      >
        ¡Hola! Ingresa tu código secreto
      </p>
      <p
        style="
          font-size: 12.5px;
          color: rgba(255, 255, 255, 0.82);
          margin: 0;
        "
      >
        Pídeselo a mamá o papá si no lo recuerdas.
      </p>
    </div>
  </div>

  <div style="text-align: center">
    <input
      class="input"
      id="inputCodigoNino"
      type="text"
      inputmode="numeric"
      maxlength="4"
      placeholder="• • • •"
      style="
        text-align: center;
        font-size: 26px;
        letter-spacing: 10px;
        font-weight: 700;
        max-width: 180px;
        margin: 0 auto 22px;
      "
    />

    <button
      class="btn-primary"
      id="btnEntrarNino"
      style="
        background: var(--wawa);
        box-shadow: 0 8px 18px rgba(239, 135, 166, 0.32);
      "
    >
      Entrar
    </button>
  </div>
</section>
