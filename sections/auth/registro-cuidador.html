<!-- ============ PANTALLA 2B · REGISTRO DEL CUIDADOR + NIÑO ============ -->
<section class="screen" id="screen-registro">
  <button
    class="btn-ghost btn-back"
    id="btnBackFromRegistro"
    style="
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    "
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <div class="hero-panel">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2">
      <div
        class="auth-icon"
        style="background: var(--surface); color: var(--salud)"
      >
        <img src="images/cuidador.jpeg" alt="Cuidador" />
      </div>
      <h2 class="font-display" style="font-size: 20px; font-weight: 700; margin: 0 0 4px; color: #ffffff">
        Crear cuenta
      </h2>
      <p style="font-size: 13px; color: rgba(255, 255, 255, 0.82); margin: 0">
        Solo el apoderado se registra. Aquí también registras a tu
        niño.
      </p>
    </div>
  </div>

  <div>
  <p
    style="
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 8px 2px;
    "
  >
    Tus datos
  </p>
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Nombres y apellidos"
    id="regNombre"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="DNI"
    id="regDni"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="email"
    placeholder="Correo electrónico"
    id="regEmail"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Celular"
    id="regTelefono"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Dirección (vivienda)"
    id="regDireccion"
  />
  <input
    class="input"
    style="margin-bottom: 16px"
    type="password"
    placeholder="Contraseña"
    id="regPassword"
  />

  <p
    style="
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 8px 2px;
    "
  >
    Datos de tu niño o niña
  </p>
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Nombres"
    id="regNinoNombre"
  />
  <div style="display: flex; gap: 8px; margin-bottom: 8px">
    <input
      class="input"
      type="number"
      placeholder="Edad"
      id="regNinoEdad"
    />
    <input
      class="input"
      type="text"
      placeholder="Tipo de sangre"
      id="regNinoSangre"
    />
  </div>
  <label
    style="font-size: 12px; font-weight: 700; color: var(--ink-soft)"
    >Código secreto para tu niño (4 dígitos)</label
  >
  <input
    class="input"
    style="margin: 6px 0 18px"
    type="text"
    inputmode="numeric"
    maxlength="4"
    placeholder="Ej. 4821"
    id="regCodigoNino"
  />

  <button class="btn-primary" id="btnCrearCuenta">
    Crear cuenta
  </button>
  <p class="auth-footnote">
    Prototipo de demostración: no se guarda en un servidor real.
  </p>
  </div>
</section>
