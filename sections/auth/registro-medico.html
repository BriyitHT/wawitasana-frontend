<!-- ============ PANTALLA 5B · REGISTRO DEL MÉDICO ============ -->
<section class="screen" id="screen-registro-medico">
  <button
    class="btn-ghost btn-back"
    id="btnBackFromRegistroMedico"
    style="
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    "
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <div class="hero-panel">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2">
      <div
        class="auth-icon"
        style="background: var(--surface); color: var(--salud)"
      >
        <img src="images/medico.jpeg" alt="Médico" />
      </div>
      <h2 class="font-display" style="font-size: 20px; font-weight: 700; margin: 0 0 4px; color: #ffffff">
        Crear cuenta de médico
      </h2>
      <p style="font-size: 13px; color: rgba(255, 255, 255, 0.82); margin: 0">
        Con tu colegiatura verificamos que eres un profesional de
        salud habilitado.
      </p>
    </div>
  </div>

  <div>
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Nombres y apellidos"
    id="regMedNombre"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="N.° de colegiatura (CMP)"
    id="regMedCmp"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Especialidad"
    id="regMedEspecialidad"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Hospital o centro de salud"
    id="regMedHospital"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="email"
    placeholder="Correo electrónico"
    id="regMedEmail"
  />
  <input
    class="input"
    style="margin-bottom: 8px"
    type="text"
    placeholder="Celular"
    id="regMedTelefono"
  />
  <input
    class="input"
    style="margin-bottom: 18px"
    type="password"
    placeholder="Contraseña"
    id="regMedPassword"
  />

  <button class="btn-primary" id="btnCrearCuentaMedico">
    Crear cuenta
  </button>
  <p class="auth-footnote">
    Prototipo de demostración: no se guarda en un servidor real.
  </p>
  </div>
</section>
