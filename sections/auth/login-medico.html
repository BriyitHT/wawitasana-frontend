<!-- ============ PANTALLA 5 · LOGIN MÉDICO ============ -->
<section class="screen" id="screen-login-medico">
  <button
    class="btn-ghost btn-back"
    id="btnBackToSplashMedico"
    style="
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    "
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
    >
      <path d="M15 18l-6-6 6-6" />
    </svg>
  </button>

  <div class="hero-panel">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2">
      <div
        class="auth-icon"
        style="background: var(--surface); color: var(--salud)"
      >
        <img src="images/medico.jpeg" alt="Médico" />
      </div>
      <h2 class="font-display" style="font-size: 21px; font-weight: 700; margin: 0 0 4px; color: #ffffff">
        Ingreso de médico
      </h2>
      <p style="font-size: 13px; color: rgba(255, 255, 255, 0.82); margin: 0">
        Usa tu número de colegiatura (CMP) para ver solo a los
        pacientes que te dieron acceso.
      </p>
    </div>
  </div>

  <div>
    <label
      style="font-size: 12px; font-weight: 700; color: var(--ink-soft)"
      >N.° de colegiatura (CMP)</label
    >
    <input
      class="input"
      style="margin: 6px 0 14px"
      type="text"
      placeholder="Ej. 12345"
      id="inputCmp"
    />

    <label
      style="font-size: 12px; font-weight: 700; color: var(--ink-soft)"
      >Contraseña</label
    >
    <input
      class="input"
      style="margin: 6px 0 20px"
      type="password"
      placeholder="••••••••"
      id="inputPasswordMedico"
    />

    <button class="btn-primary" id="btnLoginMedico">Ingresar</button>

    <button id="btnIrRegistroMedico" class="auth-link">
      ¿No tienes cuenta? Regístrate
    </button>

    <p class="auth-footnote">
      Prototipo de demostración: cualquier dato te lleva al panel de
      ejemplo.
    </p>
  </div>
</section>
