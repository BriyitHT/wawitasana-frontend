<!-- ============ PANTALLA 1 · SELECTOR DE ROL ============ -->
<section class="screen active" id="screen-splash">
  <div class="hero-panel">
    <div class="hero-shape hero-shape--1"></div>
    <div class="hero-shape hero-shape--2"></div>
    <div class="hero-shape hero-shape--3"></div>
    <div style="position: relative; z-index: 2">
      <div
        style="
          width: 68px;
          height: 68px;
          margin: 0 auto 10px;
          border-radius: 50%;
          background: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
        "
      >
        <img
          src="images/logo.png"
          alt="Logo de WawitaSana"
          class="avatar-img"
        />
      </div>
      <h1
        class="font-display"
        style="font-size: 24px; font-weight: 700; margin: 0; color: #ffffff"
      >
        WawitaSana
      </h1>
      <p
        style="
          font-size: 13px;
          color: rgba(255, 255, 255, 0.82);
          margin: 4px 0 0;
        "
      >
        Acompañamos cada paso de la ruta hematológica
      </p>
    </div>
  </div>

  <!-- Estadísticas reales (trabajo de campo del hospital) — pobladas por
       renderSplash() en js/app.js desde DEMO.estadisticasGenerales. -->
  <div
    style="
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 0 0 18px;
    "
  >
    <div
      style="
        background: var(--primario-tint);
        border-radius: var(--radius-md);
        padding: 12px 10px;
        text-align: center;
      "
    >
      <p
        class="font-display"
        style="font-size: 20px; font-weight: 700; margin: 0; color: var(--primario-dark)"
        id="statCasosRegistrados"
      >
        102
      </p>
      <p
        style="font-size: 10.5px; color: var(--ink-soft); margin: 2px 0 0; line-height: 1.25"
      >
        Casos registrados en 2025
      </p>
    </div>

    <div
      style="
        background: var(--primario-tint);
        border-radius: var(--radius-md);
        padding: 12px 10px;
        text-align: center;
      "
    >
      <p
        class="font-display"
        style="font-size: 20px; font-weight: 700; margin: 0; color: var(--primario-dark)"
      >
        <span id="statTasaAbandono">12.7</span>%
      </p>
      <p
        style="font-size: 10.5px; color: var(--ink-soft); margin: 2px 0 0; line-height: 1.25"
      >
        Tasa de abandono
      </p>
    </div>

    <div
      style="
        background: var(--primario-tint);
        border-radius: var(--radius-md);
        padding: 12px 10px;
        text-align: center;
      "
    >
      <p
        class="font-display"
        style="font-size: 20px; font-weight: 700; margin: 0; color: var(--primario-dark)"
        id="statPacientesActivos"
      >
        73
      </p>
      <p
        style="font-size: 10.5px; color: var(--ink-soft); margin: 2px 0 0; line-height: 1.25"
      >
        Pacientes activos
      </p>
    </div>

    <div
      style="
        background: var(--primario-tint);
        border-radius: var(--radius-md);
        padding: 12px 10px;
        text-align: center;
      "
    >
      <p
        class="font-display"
        style="font-size: 20px; font-weight: 700; margin: 0; color: var(--primario-dark)"
        id="statDuplasMedicas"
      >
        10
      </p>
      <p
        style="font-size: 10.5px; color: var(--ink-soft); margin: 2px 0 0; line-height: 1.25"
      >
        Duplas médicas (<span id="statTotalMedicos">20</span> médicos)
      </p>
    </div>
  </div>

  <p
    style="
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin: 0 0 4px 4px;
    "
  >
    ¿Quién eres?
  </p>

  <div class="role-path" style="margin-top: 10px">
    <button class="role-card" data-role="cuidador">
      <div class="role-icon">
        <img src="images/cuidador.jpeg" alt="Cuidador" />
      </div>
      <div>
        <div class="role-title">Cuidador</div>
        <div class="role-desc">Acompaño a mi niño en su tratamiento</div>
      </div>
    </button>

    <button class="role-card" data-role="medico">
      <div class="role-icon">
        <img src="images/medico.jpeg" alt="Médico" />
      </div>
      <div>
        <div class="role-title">Personal asistencial</div>
        <div class="role-desc">Acceso a pacientes asignados y en riesgo</div>
      </div>
    </button>
  </div>
</section>
